# Prometheus scrape configuration for the VDI stack.
#
# Both services expose /metrics via prometheus-fastapi-instrumentator. The
# built-in `up` series is what the Grafana dashboard reads: Prometheus sets
# up=1 when a scrape succeeds and up=0 when it fails (connection refused,
# timeout, unparseable body), so "is the service up?" needs no application
# metric of its own.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: provisioning
    static_configs:
      - targets: ["provisioning-server:8001"]
        labels:
          service: provisioning

  - job_name: mirroring
    static_configs:
      - targets: ["mirroring:8000"]
        labels:
          service: mirroring

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]

  # VM RDP reachability. Targets are discovered from the provisioning
  # service rather than hardcoded: pool VMs are created and destroyed
  # continuously, so their floating IPs cannot live in this file.
  - job_name: blackbox_rdp
    metrics_path: /probe
    params:
      module: [rdp_tcp]
    http_sd_configs:
      - url: http://provisioning-server:8001/sd/rdp-targets
        refresh_interval: 30s
    relabel_configs:
      # Prometheus must scrape blackbox, passing the VM as ?target=
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
