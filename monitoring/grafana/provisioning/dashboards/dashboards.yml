# Loads every dashboard JSON under /var/lib/grafana/dashboards at startup.
apiVersion: 1

providers:
  - name: VDI
    orgId: 1
    folder: VDI
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
