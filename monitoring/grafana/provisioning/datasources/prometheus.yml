# Auto-provisioned datasource — Grafana picks this up at startup, so the
# Prometheus connection needs no manual setup in the UI.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

