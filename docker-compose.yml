services:
  database:
    build:
      context: ./database
      network: host
    container_name: database
    networks:
      - app_net
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shakshor -d VDI"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    networks:
      - app_net
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  guacd:
    image: guacamole/guacd
    container_name: guacd
    networks:
      - app_net
    dns:
      - 172.17.0.251
      - 172.17.0.252
      - 8.8.8.8
    dns_search:
      - cloudlab.tirzokprivatecloud.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4822"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mirroring:
    build:
      context: ./mirroring-service
      dockerfile: Dockerfile
      network: host
    container_name: mirroring
    env_file: ./mirroring-service/.env
    networks:
      - app_net
    ports:
      - "8000:8000"
    dns:
      - 172.17.0.251
      - 172.17.0.252
      - 8.8.8.8
    dns_search:
      - cloudlab.tirzokprivatecloud.com
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      guacd:
        condition: service_healthy
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # python:3.11-slim has no curl; probe the real health path
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # mirroring-frontend: removed — the Vite app it referenced
  # (mirroring-service/mirroring-service/) was deleted in commit
  # "new_mirroring"; the static UI served by the mirroring service
  # replaces it. Re-add here when the SPA is built.

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      network: host
    container_name: auth-service
    networks:
      - app_net
    environment:
      DB_USER: shakshor
      DB_PASSWORD: shakshor
      DB_NAME: VDI
      DB_HOST: database
      DB_PORT: "5432"
    ports:
      - "8003:8003"
    dns:
      - 172.17.0.251
      - 172.17.0.252
      - 8.8.8.8
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  provisioning-server:
    build:
      context: .
      dockerfile: provisioning_service/Dockerfile
      network: host
    container_name: provisioning-server
    env_file: ./provisioning_service/.env
    command: >
      uvicorn provisioning_service.main:app
      --host 0.0.0.0
      --port 8001
    networks:
      - app_net
    dns:
      - 172.17.0.251
      - 172.17.0.252
      - 8.8.8.8
    dns_search:
      - cloudlab.tirzokprivatecloud.com
    ports:
      - "8001:8001"
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  provisioning-worker:
    build:
      context: .
      dockerfile: provisioning_service/Dockerfile
      network: host
    container_name: provisioning-worker
    env_file: ./provisioning_service/.env
    command: >
      celery -A provisioning_service.message_queue.celery_app worker
      --loglevel=info
    networks:
      - app_net
    dns:
      - 172.17.0.251
      - 172.17.0.252
      - 8.8.8.8
    dns_search:
      - cloudlab.tirzokprivatecloud.com
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  provisioning-beat:
    build:
      context: .
      dockerfile: provisioning_service/Dockerfile
      network: host
    container_name: provisioning-beat
    env_file: ./provisioning_service/.env
    command: >
      celery -A provisioning_service.message_queue.celery_beat beat
      --loglevel=info
    networks:
      - app_net
    dns:
      - 172.17.0.251
      - 172.17.0.252
      - 8.8.8.8
    dns_search:
      - cloudlab.tirzokprivatecloud.com
    cap_add:
      - NET_ADMIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

networks:
  app_net:
    driver: bridge
    name: app_net
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"

volumes:
  postgres_data:
  rabbitmq_data:
